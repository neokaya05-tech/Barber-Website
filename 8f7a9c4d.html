<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasi Cuts — Master Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <!-- Update this line in your <head> block -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    
    <style>
        /* 🎨 HYPER-MODERN LUXURY GLASSMORPHISM THEME */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rubik', sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            padding: 40px 20px;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, rgba(204, 164, 59, 0.05), transparent 400px);
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 25px;
            margin-bottom: 35px;
        }

        .title-group h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 2.6rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .title-group h1 span {
            color: #cca43b;
            text-shadow: 0 0 20px rgba(204, 164, 59, 0.2);
        }

        .title-group p {
            color: #777;
            font-size: 0.95rem;
            margin-top: 6px;
        }

        .btn-refresh {
            background: #111111;
            color: #cca43b;
            border: 1px solid rgba(204, 164, 59, 0.3);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-refresh:hover {
            background: #cca43b;
            color: #000000;
            border-color: #cca43b;
            box-shadow: 0 0 15px rgba(204, 164, 59, 0.25);
            transform: translateY(-2px);
        }

        /* 📈 STATS COUNTERS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(18, 18, 18, 0.6);
            border: 1px solid #161616;
            padding: 30px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(204, 164, 59, 0.15);
        }

        .stat-card h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #555;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .stat-card p {
            font-size: 3.2rem;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            line-height: 1;
        }

        .stat-card.total p { color: #ffffff; }
        .stat-card.pending p { color: #cca43b; border-left: 3px solid #cca43b; padding-left: 12px; }
        .stat-card.confirmed p { color: #00e676; border-left: 3px solid #00e676; padding-left: 12px; }

        /* 📄 OPERATIONS PANEL DATA TABLE */
        .table-container {
            background: rgba(15, 15, 15, 0.7);
            border: 1px solid #161616;
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(25, 25, 25, 0.5);
            color: #cca43b;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            padding: 20px;
            font-weight: 600;
            border-bottom: 1px solid #1a1a1a;
        }

        td {
            padding: 20px;
            border-bottom: 1px solid #121212;
            font-size: 0.95rem;
            color: #e0e0e0;
            vertical-align: middle;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.01);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge-service {
            background: #141414;
            border: 1px solid #222;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #dcdcdc;
            font-weight: 500;
        }

        .status-pill {
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .status-pill.pending { background: rgba(204, 164, 59, 0.1); color: #cca43b; border: 1px solid rgba(204, 164, 59, 0.2); }
        .status-pill.confirmed { background: rgba(0, 230, 118, 0.1); color: #00e676; border: 1px solid rgba(0, 230, 118, 0.2); }
        .status-pill.cancelled { background: rgba(230, 57, 70, 0.1); color: #e63946; border: 1px solid rgba(230, 57, 70, 0.2); }

        /* ⚡ ACTION INTERFACES BUTTONS */
        .actions-cell {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-action {
            background: #141414;
            border: 1px solid #252525;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }

        .btn-action.confirm:hover { background: rgba(0, 230, 118, 0.15); border-color: #00e676; color: #00e676; }
        .btn-action.whatsapp:hover { background: rgba(37, 211, 102, 0.15); border-color: #25d366; color: #25d366; }
        .btn-action.cancel:hover { background: rgba(230, 57, 70, 0.15); border-color: #e63946; color: #e63946; }

        /* 🔔 FULL SCREEN OVERLAY MODAL PROMPT */
        #toast-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 3, 3, 0.85);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .custom-toast {
            background: #0f0f0f;
            border: 1px solid rgba(204, 164, 59, 0.4);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 460px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
            animation: modalFadeIn 0.25s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .custom-toast h4 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .custom-toast p {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .custom-toast textarea {
            width: 100%;
            background: #050505;
            border: 1px solid #222;
            color: #fff;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            resize: none;
            height: 100px;
        }

        .custom-toast textarea:focus {
            border-color: #cca43b;
            outline: none;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .modal-buttons button {
            padding: 10px 22px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .modal-buttons .btn-close { background: #1a1a1a; color: #999; }
        .modal-buttons .btn-close:hover { background: #252525; color: #fff; }
        .modal-buttons .btn-save { background: #cca43b; color: #000; }
        .modal-buttons .btn-save:hover { background: #e5b945; transform: translateY(-1px); }

        @keyframes modalFadeIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="title-group">
                <h1>Kasi Cuts <span>Dashboard</span></h1>
                <p>Live Store Appointment Operations Management Panel</p>
            </div>
            <button class="btn-refresh" id="refresh-btn">
                <ion-icon name="refresh-outline"></ion-icon>
                Refresh List
            </button>
        </header>

        <div class="stats-grid">
            <div class="stat-card total">
                <h3>Total Bookings</h3>
                <p id="stat-total">0</p>
            </div>
            <div class="stat-card pending">
                <h3>Pending Actions</h3>
                <p id="stat-pending">0</p>
            </div>
            <div class="stat-card confirmed">
                <h3>Confirmed Schedules</h3>
                <p id="stat-confirmed">0</p>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Customer Name</th>
                        <th>Phone Info</th>
                        <th>Selected Service</th>
                        <th>Date &amp; Time Slot</th>
                        <th>Current Status</th>
                        <th>Management Actions</th>
                    </tr>
                </thead>
                <tbody id="bookings-table-body">
                    <tr>
                        <td colspan="6" style="text-align: center; color: #555; padding: 50px;">
                            <ion-icon name="hourglass-outline" style="font-size: 26px; vertical-align: middle; margin-right: 10px; animation: spin 2s linear infinite;"></ion-icon>
                            Syncing database rows...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="toast-container"></div>

<script>
        // Custom input popup prompt window engine 
        function showCustomPrompt(title, subtitle, defaultValue, onConfirm) {
            const container = document.getElementById('toast-container');
            if (!container) return;

            container.innerHTML = `
                <div class="custom-toast">
                    <h4 style="color: #cca43b;">${title}</h4>
                    <p>${subtitle}</p>
                    <textarea id="prompt-input">${defaultValue}</textarea>
                    <div class="modal-buttons">
                        <button class="btn-close" id="prompt-cancel">Cancel</button>
                        <button class="btn-save" id="prompt-confirm">Send Message</button>
                    </div>
                </div>
            `;

            container.style.display = 'flex';
            const inputField = container.querySelector('#prompt-input');
            inputField.focus();

            container.querySelector('#prompt-confirm').onclick = () => {
                const value = inputField.value;
                container.style.display = 'none';
                container.innerHTML = '';
                onConfirm(value);
            };

            container.querySelector('#prompt-cancel').onclick = () => {
                container.style.display = 'none';
                container.innerHTML = '';
            };
        }

        // Live API Synchronization Engine
        async function fetchAppointments() {
            try {
                const res = await fetch('http://localhost:5000/api/appointments');
                const data = await res.json();
                
                if (!res.ok) throw new Error(data.message || 'Fetch failed');
                
                renderTable(data);
                updateStats(data);
            } catch (err) {
                console.error('Database Sync Error:', err);
                document.getElementById('bookings-table-body').innerHTML = `
                    <tr><td colspan="6" style="text-align: center; color: #e63946; padding: 30px;">⚠️ Unable to link data server stream. Check backend terminal.</td></tr>
                `;
            }
        }

        // 📈 STATS COUNTER SYSTEM — Handles any case capitalization automatically
        function updateStats(list) {
            const total = list.length;
            const pending = list.filter(a => !a.status || a.status.toLowerCase() === 'pending').length;
            const confirmed = list.filter(a => a.status && a.status.toLowerCase() === 'confirmed').length;

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-confirmed').innerText = confirmed;
        }

        function renderTable(list) {
            const body = document.getElementById('bookings-table-body');
            if (list.length === 0) {
                body.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 40px; color: #555;">No operational hair records inside tables.</td></tr>`;
                return;
            }

            body.innerHTML = list.map(item => {
                const appointmentId = item._id || item.id;
                const currentStatus = item.status || 'Pending';
                
                return `
                    <tr>
                        <td><strong>${item.customerName || 'Walk-In'}</strong></td>
                        <td>${item.phoneNumber || 'N/A'}</td>
                        <td><span class="badge-service">${item.service}</span></td>
                        <td>${item.date} @ ${item.timeSlot}</td>
                        <td><span id="status-pill-${appointmentId}" class="status-pill ${currentStatus.toLowerCase()}">${currentStatus}</span></td>
                        <td>
                            <div class="actions-cell">
                                <button class="btn-action confirm" title="Confirm Appointment" onclick="updateStatus('${appointmentId}', 'Confirmed')">
                                    <ion-icon name="checkmark-done-outline"></ion-icon>
                                </button>
                                
                                <button class="btn-action whatsapp" title="Custom WhatsApp message" onclick="triggerWhatsAppCustom('${item.phoneNumber}', '${item.customerName}', '${item.service}', '${item.timeSlot}')">
                                    <ion-icon name="logo-whatsapp"></ion-icon>
                                </button>
                                
                                <button class="btn-action cancel" title="Cancel Appointment" onclick="triggerCancellation('${appointmentId}', '${item.phoneNumber}', '${item.customerName}')">
                                    <ion-icon name="close-outline"></ion-icon>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // 🔄 THE CRITICAL ROUTE FIX: Uses PUT to match your server.js endpoint exactly
        async function updateStatus(id, newStatus) {
            if (!id || id === 'undefined') {
                console.error("Error: Target Row ID could not be parsed.");
                return;
            }

            // Visual Optimism: Update UI color state instantly on click
            const targetPill = document.getElementById(`status-pill-${id}`);
            if (targetPill) {
                targetPill.className = `status-pill ${newStatus.toLowerCase()}`;
                targetPill.innerText = newStatus;
            }

            try {
                // Changing method from PATCH to PUT to line up perfectly with your app.put() route
                const res = await fetch(`http://localhost:5000/api/appointments/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus }) // Passes 'Confirmed' or 'Cancelled'
                });

                if (res.ok) {
                    fetchAppointments(); // Re-fetch to securely sync database numbers and update top counter cards
                } else {
                    console.warn("Database rejected status change request code:", res.status);
                }
            } catch (err) {
                console.error('Network execution route error:', err);
            }
        }

        // WhatsApp Custom Chat Bubble Action Handler
        function triggerWhatsAppCustom(phone, name, service, timeSlot) {
            const initialTemplate = `Hi ${name}, this is Kasi Cuts. Just wanted to update you regarding your booking for ${service} at ${timeSlot}...`;
            
            showCustomPrompt(
                "Custom WhatsApp Client Chat", 
                `Send a direct operational message, load delay notice, or personal note to ${name}:`,
                initialTemplate, 
                function(customMessage) {
                    if (customMessage) {
                        const encryptedText = encodeURIComponent(customMessage);
                        window.open(`https://wa.me/${phone}?text=${encryptedText}`, '_blank');
                    }
                }
            );
        }

        // Cancellation Handler
        function triggerCancellation(id, phone, name) {
            showCustomPrompt(
                "Confirm Cancellation Action", 
                `Specify the reason for dropping ${name}'s schedule:`,
                "unexpected loadshedding operational limits", 
                function(reason) {
                    if (reason) {
                        updateStatus(id, 'Cancelled');
                        const cancellationText = encodeURIComponent(`Hi ${name}, your Kasi Cuts booking has been cancelled due to: ${reason}. Please visit our schedule layout to rebook.`);
                        window.open(`https://wa.me/${phone}?text=${cancellationText}`, '_blank');
                    }
                }
            );
        }

        // Click Action Bindings
        document.getElementById('refresh-btn').onclick = fetchAppointments;
        window.onload = fetchAppointments;
    </script></body>
</html>
